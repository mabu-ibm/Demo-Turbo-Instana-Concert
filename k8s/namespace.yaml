# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: demo-turbo-instana-concert
  labels:
    name: demo-turbo-instana-concert
    app.kubernetes.io/name: demo-turbo-instana-concert
    app.kubernetes.io/component: observability-demo
    security.policy.io/isolation: demo-environment

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-turbo-instana-concert-sa
  namespace: demo-turbo-instana-concert
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-turbo-instana-concert-reader
  namespace: demo-turbo-instana-concert
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-turbo-instana-concert-reader-binding
  namespace: demo-turbo-instana-concert
subjects:
  - kind: ServiceAccount
    name: demo-turbo-instana-concert-sa
    namespace: demo-turbo-instana-concert
roleRef:
  kind: Role
  name: demo-turbo-instana-concert-reader
  apiGroup: rbac.authorization.k8s.io

---
# Secret for demo credentials
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: demo-turbo-instana-concert
type: Opaque
data:
  database-user: ZGVtb3VzZXI=
  database-password: ZGVtb3Bhc3N3b3Jk
  api-key: ZGVtby1hcGkta2V5LXR1cmJvLWluc3RhbmE=
